name: Release Windows Vulkan

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-vulkan:
    runs-on: windows-2022
    env:
      CARGO_TARGET_DIR: 'C:\b\t'
      TMP: 'C:\b\tmp'
      TEMP: 'C:\b\tmp'
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Prepare short build paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:CARGO_TARGET_DIR, $env:TMP | Out-Null

      - name: Ensure CMake and Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress -y
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress -y
          }
          cmake --version
          ninja --version

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $sdkVersion = (Invoke-RestMethod 'https://vulkan.lunarg.com/sdk/latest/windows.json').windows
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan_sdk.exe'
          $installRoot = Join-Path 'C:\VulkanSDK' $sdkVersion

          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe?Human=true' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList @(
            '--root', $installRoot,
            '--accept-licenses',
            '--default-answer',
            '--confirm-command',
            'install',
            'copy_only=1'
          ) -Wait -NoNewWindow

          if (-not (Test-Path (Join-Path $installRoot 'Bin\glslc.exe'))) {
            throw 'glslc.exe not found after Vulkan SDK install'
          }
          if (-not (Test-Path (Join-Path $installRoot 'Lib\vulkan-1.lib'))) {
            throw 'vulkan-1.lib not found after Vulkan SDK install'
          }

          "VULKAN_SDK=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $installRoot 'Bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build rqmd.exe
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set /A CMAKE_BUILD_PARALLEL_LEVEL=%NUMBER_OF_PROCESSORS%-1
          cargo build --locked --release -p rqmd --features vulkan --target x86_64-pc-windows-msvc

      - name: Resolve package version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'rqmd' } | Select-Object -First 1).version
          if (-not $version) {
            throw 'Failed to resolve rqmd version from cargo metadata'
          }
          "RQMD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RQMD_ZIP_NAME=rqmd-windows-x64-vulkan-$version.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package release zip
        shell: pwsh
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc\release\rqmd.exe"
          $zip = Join-Path $env:RUNNER_TEMP $env:RQMD_ZIP_NAME
          Compress-Archive -LiteralPath $exe -DestinationPath $zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rqmd-windows-x64-vulkan-${{ env.RQMD_VERSION }}
          path: ${{ runner.temp }}/${{ env.RQMD_ZIP_NAME }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/${{ env.RQMD_ZIP_NAME }}
          fail_on_unmatched_files: true
          generate_release_notes: true
